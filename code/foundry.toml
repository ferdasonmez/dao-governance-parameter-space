[profile.default]
src = "src"
out = "out"
via_ir = true
optimizer = true
optimizer_runs = 200
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
# JSON dosyaları için erişim izni
fs_permissions = [
    { access = "read", path = "./test/data" },
    { access = "read", path = "./test" }
]